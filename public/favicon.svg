<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Racket Frame Gradient -->
    <linearGradient id="frameGrad" x1="10" y1="10" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="50%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#143728" />
    </linearGradient>
    <!-- Lime Grip Gradient -->
    <linearGradient id="gripGrad" x1="38" y1="38" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a3e635" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>
    <!-- Shuttlecock Feather Gradient -->
    <linearGradient id="featherGrad" x1="6" y1="40" x2="20" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#052014" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Group with subtle shadow -->
  <g filter="url(#shadow)">
    <!-- Shuttlecock in bottom-left -->
    <g transform="translate(4, 34) scale(0.65) rotate(-25)">
      <!-- Feathers -->
      <path d="M12 2 L2 22 L22 22 Z" fill="url(#featherGrad)" stroke="#cbd5e1" stroke-width="1.2" stroke-linejoin="round" />
      <line x1="6" y1="14" x2="18" y2="14" stroke="#94a3b8" stroke-width="1" />
      <line x1="8" y1="9" x2="16" y2="9" stroke="#94a3b8" stroke-width="1" />
      <!-- Cork base -->
      <ellipse cx="12" cy="22" rx="4.5" ry="3.5" fill="#facc15" stroke="#ca8a04" stroke-width="1" />
    </g>

    <!-- Badminton Racket -->
    <!-- Head / Frame (Angled 45 deg, centered) -->
    <g transform="rotate(-45 26 26)">
      <!-- Oval Head Frame -->
      <ellipse cx="26" cy="18" rx="14" ry="17" stroke="url(#frameGrad)" stroke-width="3" fill="#ffffff" fill-opacity="0.08" />
      
      <!-- String Grid (Verticals) -->
      <g stroke="#86efac" stroke-width="0.8" stroke-opacity="0.75">
        <line x1="16" y1="9" x2="16" y2="27" />
        <line x1="19.5" y1="4" x2="19.5" y2="32" />
        <line x1="23" y1="2" x2="23" y2="34" />
        <line x1="26" y1="1.2" x2="26" y2="34.8" />
        <line x1="29" y1="2" x2="29" y2="34" />
        <line x1="32.5" y1="4" x2="32.5" y2="32" />
        <line x1="36" y1="9" x2="36" y2="27" />

        <!-- String Grid (Horizontals) -->
        <line x1="17" y1="7" x2="35" y2="7" />
        <line x1="14" y1="11" x2="38" y2="11" />
        <line x1="12.5" y1="15" x2="39.5" y2="15" />
        <line x1="12.2" y1="19" x2="39.8" y2="19" />
        <line x1="13.2" y1="23" x2="38.8" y2="23" />
        <line x1="15" y1="27" x2="37" y2="27" />
        <line x1="19" y1="31" x2="33" y2="31" />
      </g>

      <!-- T-Joint -->
      <path d="M23.5 34.5 L28.5 34.5 L27 38.5 L25 38.5 Z" fill="#143728" />

      <!-- Shaft -->
      <line x1="26" y1="37" x2="26" y2="52" stroke="#15803d" stroke-width="2.5" stroke-linecap="round" />

      <!-- Handle Grip -->
      <rect x="23.5" y="51" width="5" height="15" rx="2" fill="url(#gripGrad)" stroke="#143728" stroke-width="0.8" />
      <!-- Grip Wraps -->
      <line x1="23.5" y1="54" x2="28.5" y2="56" stroke="#143728" stroke-width="0.9" />
      <line x1="23.5" y1="58" x2="28.5" y2="60" stroke="#143728" stroke-width="0.9" />
      <line x1="23.5" y1="62" x2="28.5" y2="64" stroke="#143728" stroke-width="0.9" />
      <!-- Butt Cap -->
      <rect x="23" y="65" width="6" height="2" rx="0.5" fill="#143728" />
    </g>
  </g>
</svg>
